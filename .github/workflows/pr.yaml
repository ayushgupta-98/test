name: PR Sticky Comment

on:
  pull_request:

permissions:
    pull-requests: write
    contents: read

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: workflow-result
          message: |
            Test
      - name: Post sticky PR comment2
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: workflow-result
          message: |
            Test2
